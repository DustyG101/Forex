name: Sensibilidad del gate Gen 333
on:
  push:
    branches: [codex/m5-gen333-gate-sensitivity]
    paths: ['scripts/audit_m5_gate_sensitivity.py', '.github/workflows/m5-gate-sensitivity.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13627574393
          run-id: 42507157819
          github-token: ${{ github.token }}
          path: data/gate-sensitivity
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13631131495,13631151337
          run-id: 42514492433
          github-token: ${{ github.token }}
          path: data/gate-sensitivity
          merge-multiple: true
      - run: python -m scripts.audit_m5_gate_sensitivity
      - uses: actions/upload-artifact@v7
        with:
          name: m5-gate-sensitivity
          path: reports/gate-sensitivity/
          if-no-files-found: error
