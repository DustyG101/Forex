name: PR44 — Q3 2026 Single-Pass OOS / all 24 frozen FX genomes

on:
  workflow_dispatch:
  push:
    branches:
      - codex/forex-pr44-q3-single-pass-oos
    paths:
      - 'research/triggers/pr44-q3-final-audit-v*.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: pr44-one-time-q3-24-frozen
  cancel-in-progress: false

env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  oos_single_pass:
    name: Preflight 4 certified Q3 sources, then ONE pass of 24 frozen models
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Zero-compute Q3 source readiness gate (BEFORE any pip installs)
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_REPO_READ_TOKEN: ${{ secrets.ORIGINAL_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${ORIGINAL_REPO_READ_TOKEN:-}" ]]; then
            echo "::error::BLOCKED: Add repository secret ORIGINAL_REPO_READ_TOKEN with actions:read access to Asriel550/Forex."
            exit 1
          fi
          for PAIR in EURUSD GBPUSD AUDUSD USDCAD; do
            slug="$(echo "$PAIR" | tr '[:upper:]' '[:lower:]')"
            tag="data-pr44-q3-${slug}-m5-m15-garch-universe-2026q3-v1"
            if ! gh release view "$tag" --repo Asriel550/Forex >/dev/null 2>&1; then
              echo "::error::BLOCKED: Missing independently certified Q3 M5/M15/GARCH release for $PAIR: $tag"
              exit 1
            fi
            for asset in universe.npz manifest.json; do
              if ! gh release view "$tag" --repo Asriel550/Forex --json assets \
                  --jq '.assets[].name' | grep -Fxq "$asset"; then
                echo "::error::BLOCKED: Q3 $PAIR release missing $asset"
                exit 1
              fi
            done
          done
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Minimal read-only numerical runtime (no PPO, PyTorch or training)
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.3.5 pandas==2.3.3 scipy==1.18.1 arch==8.0.0 \
            gymnasium==1.1.1 'pytest>=8.3'
      - name: Pre-registered policy and causality checks; SYNTHETIC ONLY
        run: python -m pytest -q tests/test_pr44_q3_single_pass_audit.py
      - name: Retrieve 12 original controls from completed PR41
        uses: actions/download-artifact@v8
        with:
          pattern: pr41-native-*
          run-id: 42576852134
          repository: Asriel550/Forex
          github-token: ${{ secrets.ORIGINAL_REPO_READ_TOKEN }}
          path: reports/pr44-control-models
      - name: Retrieve 12 evolved models from completed PR43 (no new evolution)
        uses: actions/download-artifact@v8
        with:
          pattern: pr43-continued-*
          run-id: 42647437793
          repository: Asriel550/Forex
          github-token: ${{ secrets.ORIGINAL_REPO_READ_TOKEN }}
          path: reports/pr44-evolved-models
      - name: Download four already-certified Q3 inference universes ONCE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for PAIR in EURUSD GBPUSD AUDUSD USDCAD; do
            slug="$(echo "$PAIR" | tr '[:upper:]' '[:lower:]')"
            dir="reports/pr44-q3-native/$slug"
            mkdir -p "$dir"
            gh release download "data-pr44-q3-${slug}-m5-m15-garch-universe-2026q3-v1" \
              --repo Asriel550/Forex --pattern universe.npz \
              --pattern manifest.json --dir "$dir" --clobber
          done
      - name: One-shot OOS read-only replay, 24 frozen genomes, 4 isolated account ledgers
        run: |
          python -m scripts.run_pr44_q3_single_pass_audit \
            --control-root reports/pr44-control-models \
            --evolved-root reports/pr44-evolved-models \
            --q3-root reports/pr44-q3-native
      - name: Publish final decision table without choosing any winner
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('reports/pr44-q3-single-pass/q3-verdict.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['completed']==24 and d['genetic_evaluations']==0
          assert d['model_selection_performed'] is False and d['oos_first_pass'] is True
          assert len(d['results'])==24
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
            f.write('## PR44 frozen-model Q3 2026 OOS, no model selection or refits\n\n')
            f.write(f"**Passing: {d['passes']} / 24** — complete July–September, independent accounts.\n\n")
            f.write('| Group | Pair | Seed | PF Q3 | DD Q3 | Degradation H1 | Trades | Verdict |\n')
            f.write('| --- | --- | ---: | ---: | ---: | ---: | ---: | --- |\n')
            for r in d['results']:
              pf='Undefined' if r['pf_q3'] is None else f"{r['pf_q3']:.3f}"
              deg='Undefined' if r['degradation_pct'] is None else f"{r['degradation_pct']:.1f}%"
              f.write(f"| {r['group']} | {r['symbol']} | {r['seed']} | {pf} | "
                      f"{r['dd_q3_pct']:.2f}% | {deg} | {r['executed_q3']} | "
                      f"{'PASS' if r['qualifies'] else 'FAIL'} |\n")
            f.write('\n**All 24 models evaluated**. No optimization, promotion or retrospective model picking.\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: pr44-final-q3-oos-24-frozen-genomes
          path: reports/pr44-q3-single-pass/q3-verdict.json
          if-no-files-found: error
          retention-days: 90
