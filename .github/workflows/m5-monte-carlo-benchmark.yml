name: Prueba M5 de vetos y control Monte Carlo
on:
  push:
    branches: [codex/m5-monte-carlo-benchmark]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '42'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13605260077
          run-id: 42448607949
          github-token: ${{ github.token }}
          path: data/mc-comparison/gen268
          merge-multiple: true
      - name: Replay vetoes and matched Monte Carlo controls
        run: python -m scripts.veto_m5_mc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m5-march-veto-monte-carlo
          path: data/mc-comparison/veto.json
          if-no-files-found: warn
