name: Comparación M5 contra Monte Carlo
on:
  push:
    branches: [codex/m5-monte-carlo-benchmark]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '42'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - uses: actions/cache/restore@v6
        with:
          path: data/histdata_scalping
          key: histdata-scalping-2025-${{ hashFiles('datasets/eurusd/manifest.json') }}
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13602723888
          run-id: 42445210001
          github-token: ${{ github.token }}
          path: data/mc-comparison/gen239
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13605260077
          run-id: 42448607949
          github-token: ${{ github.token }}
          path: data/mc-comparison/gen268
          merge-multiple: true
      - name: Replay historical confirmation
        run: python -m scripts.compare_m5_mc historical
      - name: Compare on fresh chronological windows
        run: python -m scripts.compare_m5_mc fresh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m5-monte-carlo-comparison
          path: data/mc-comparison/*.json
          if-no-files-found: warn
