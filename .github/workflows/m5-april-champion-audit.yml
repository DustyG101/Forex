name: Auditoría de abril de los campeones multiescala
on:
  push:
    branches: [codex/m5-april-champion-audit]
    paths: ['scripts/audit_m5_april_champions.py', '.github/workflows/m5-april-champion-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: '42'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: 13627574393,13627887764
          run-id: 42507157819
          github-token: ${{ github.token }}
          path: data/m5-april-audit
          merge-multiple: true
      - name: Score the sealed genomes and audit individual April admissions
        run: python -m scripts.audit_m5_april_champions
      - uses: actions/upload-artifact@v7
        with:
          name: m5-april-champion-audit
          path: reports/m5-april-audit/
          if-no-files-found: error
